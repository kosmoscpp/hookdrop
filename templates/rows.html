{{ range . }}
<tr>
    <td>{{ .ID }}</td>
    <td class="time">{{ .ReceivedAt.Format "15:04:05" }}</td>
    <td><pre>{{ .Payload }}</pre></td>
    <td>
        <form hx-post="/webhook/replay" hx-target="this" hx-swap="outerHTML" style="display: flex; gap: 0.5rem;">
            <input type="hidden" name="id" value="{{ .ID }}">
            <input type="url" name="target_url" placeholder="http://localhost:9000" required style="padding: 0.5rem; border-radius: 4px; border: 1px solid #334155; background: #0f172a; color: white; width: 150px;">
            <button type="submit" style="padding: 0.5rem 1rem; background: #38bdf8; color: #0f172a; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">Replay</button>
        </form>
    </td>
</tr>
{{ else }}
<tr>
    <td colspan="4" style="text-align: center;">No webhooks received yet. Send one using curl!</td>
</tr>
{{ end }}
